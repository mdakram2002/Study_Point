name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - '.github/workflows/backend-ci-cd.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'server/**'
      - '.github/workflows/backend-ci-cd.yml'

env:
  DOCKER_IMAGE_NAME: ${{ secrets.DOCKER_IMAGE_NAME }}
  DOCKER_REGISTRY: docker.io
  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
  AZURE_CONTAINER_GROUP: ${{ secrets.AZURE_CONTAINER_GROUP }}

jobs:
  ci:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: ./server
        run: npm ci --omit=dev

      - name: Run lint (if configured)
        working-directory: ./server
        run: npm run lint || echo "No lint script found, skipping"
        continue-on-error: true

      - name: Run tests (if configured)
        working-directory: ./server
        run: npm test || echo "No test script found, skipping"
        continue-on-error: true

  build-and-deploy:
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set image tag
        id: image-tag
        run: |
          # Generate deterministic tag from GitHub SHA
          IMAGE_TAG="main-${GITHUB_SHA::7}"
          echo "tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          FULL_IMAGE="${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}:${IMAGE_TAG}"
          echo "full_image=${FULL_IMAGE}" >> $GITHUB_OUTPUT
          echo "Building and pushing image: ${FULL_IMAGE}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: |
            ${{ steps.image-tag.outputs.full_image }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Docker image exists
        run: |
          echo "Verifying Docker image exists: ${{ steps.image-tag.outputs.full_image }}"
          docker pull "${{ steps.image-tag.outputs.full_image }}"
          echo "Image verified successfully"

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Instances
        run: |
          # Update the existing Azure Container Instance with the new Docker image
          echo "Updating Azure Container Instance: ${{ env.AZURE_CONTAINER_GROUP }}"
          
          # Delete existing container if it exists
          echo "Checking if container exists..."
          if az container show --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --name ${{ env.AZURE_CONTAINER_GROUP }} >/dev/null 2>&1; then
            echo "Deleting existing container..."
            az container delete \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --name ${{ env.AZURE_CONTAINER_GROUP }} \
              --yes
            echo "Existing container deleted"
          else
            echo "No existing container found"
          fi
          
          # Create new container with the updated image
          echo "Creating new container with image: ${{ steps.image-tag.outputs.full_image }}"
          az container create \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AZURE_CONTAINER_GROUP }} \
            --image ${{ steps.image-tag.outputs.full_image }} \
            --os-type Linux \
            --restart-policy Always \
            --cpu 1 \
            --memory 1 \
            --ports 80 \
            --registry-login-server ${{ env.DOCKER_REGISTRY }} \
            --registry-username ${{ secrets.DOCKER_USERNAME }} \
            --registry-password ${{ secrets.DOCKER_PASSWORD }}
          
          echo "Container instance created successfully"
          
          # Verify the container is running
          echo "Checking container status..."
          az container show \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AZURE_CONTAINER_GROUP }} \
            --query "{state:instanceView.state, ipAddress:ipAddress.ip}" \
            --output tsv

      - name: Deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Docker Image**: ${{ steps.image-tag.outputs.full_image }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Azure Resource Group**: ${{ env.AZURE_RESOURCE_GROUP }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Azure Container Group**: ${{ env.AZURE_CONTAINER_GROUP }}" >> $GITHUB_STEP_SUMMARY
